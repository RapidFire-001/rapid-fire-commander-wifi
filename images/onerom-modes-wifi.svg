<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" role="img" aria-labelledby="title desc">
  <title id="title">Choose OneROM mode on Commander Wi-Fi</title>
  <desc id="desc">Four mode buttons: TunerPro bridge, SD tune selector, SD Card Access, and TunerPro plus GT Pro.</desc>
  <rect width="720" height="390" rx="8" fill="#151b20"/>
  <g font-family="Arial, sans-serif" fill="#fff">
    <text x="28" y="45" font-size="24" fill="#21d4eb">CHOOSE ONEROM MODE</text>
    <text x="28" y="92" font-size="20">Choose a mode. OneROM is detected on USB2.</text>
    <rect x="38" y="150" width="300" height="44" rx="6" fill="#2096ed"/>
    <text x="188" y="179" font-size="20" text-anchor="middle">TunerPro bridge</text>
    <rect x="362" y="150" width="300" height="44" rx="6" fill="#2096ed"/>
    <text x="512" y="179" font-size="20" text-anchor="middle">SD tune selector</text>
    <rect x="38" y="212" width="300" height="44" rx="6" fill="#2096ed"/>
    <text x="188" y="241" font-size="20" text-anchor="middle">SD Card Access</text>
    <rect x="362" y="212" width="300" height="44" rx="6" fill="#2096ed"/>
    <text x="512" y="241" font-size="20" text-anchor="middle">TunerPro + GT Pro</text>
    <rect x="282" y="322" width="140" height="44" rx="6" fill="#2096ed"/>
    <text x="352" y="351" font-size="20" text-anchor="middle">Close</text>
    <text x="28" y="281" font-size="20">Fire28A / Fire28C / Fire32A / Fire32B</text>
  </g>
</svg>
